<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>Термины УЭР</title>
<style>
  /* ===== Цветовые токены (светлая тема) ===== */
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --accent: #4f6ef7;
    --accent-ink: #3550d6;
    --accent-soft: #eef1fe;
    --ok-bg: #e6f4ea;
    --ok: #2e7d32;
    --bad-bg: #fdecea;
    --bad: #c62828;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
    --radius: 14px;
  }
  /* ===== Тёмная тема (автоматически по настройке системы) ===== */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --card: #1c1d20;
      --text: #f2f2f4;
      --muted: #9a9aa1;
      --line: #2c2d31;
      --accent: #7b93ff;
      --accent-ink: #9aaeff;
      --accent-soft: #23283d;
      --ok-bg: #16301d;
      --ok: #7fd18b;
      --bad-bg: #3a1a1a;
      --bad: #ff8a80;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }

  /* ===== Навигация ===== */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .brand { font-weight: 600; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 2px; flex-shrink: 0; }
  .seg button {
    border: 0; background: transparent; padding: 7px 14px; border-radius: 8px;
    font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, box-shadow .2s;
    min-height: 36px;
  }
  .seg button[aria-selected="true"] { background: var(--card); box-shadow: var(--shadow); }

  h1 { font-size: 28px; line-height: 1.2; margin: 28px 0 6px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* ===== Экран билетов ===== */
  .tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .ticket {
    border: 0; text-align: left; padding: 18px; cursor: pointer;
    transition: transform .2s, box-shadow .2s;
  }
  .ticket:hover { transform: translateY(-1px); }
  .ticket:focus-visible, .btn:focus-visible, .opt:focus-visible, .seg button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticket b { display: block; font-size: 19px; margin-bottom: 2px; }
  .ticket small { color: var(--muted); font-size: 14px; display: block; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
  .ticket .best { margin-top: 8px; font-size: 14px; color: var(--muted); }

  .opts-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 20px; padding: 14px 18px; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 15px; }
  .switch input { width: 20px; height: 20px; accent-color: var(--accent); }
  .link { background: none; border: 0; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: underline; padding: 8px 0; }

  /* ===== Экран вопроса ===== */
  .qtop { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; gap: 12px; }
  .back { background: none; border: 0; color: var(--accent-ink); cursor: pointer; padding: 8px 0; font-size: 15px; min-height: 44px; }
  .count { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

  .term { padding: 28px 22px; text-align: center; }
  .term .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .term h2 { font-size: 26px; line-height: 1.25; margin: 8px 0 0; letter-spacing: -.01em; }

  /* Таймер: кольцо обратного отсчёта */
  .timer { display: flex; align-items: center; gap: 14px; margin: 16px 0; padding: 14px 18px; }
  .ring { width: 48px; height: 48px; flex-shrink: 0; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--line); }
  .ring .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  .timer p { margin: 0; font-size: 15px; color: var(--muted); }
  .timer.ready { background: var(--accent-soft); }
  .timer.ready p { color: var(--accent-ink); font-weight: 500; }

  .options { display: grid; gap: 10px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    width: 100%; padding: 16px 18px; border: 1.5px solid transparent; cursor: pointer;
    font-size: 16px; line-height: 1.45;
    transition: border-color .2s, background .2s, opacity .2s;
  }
  .opt .k {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 8px; background: var(--line);
    display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .opt:not(:disabled):hover { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt.locked { cursor: not-allowed; }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); }
  .opt.correct .k { background: var(--ok); color: #fff; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .opt.wrong .k { background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }

  .feedback { margin-top: 16px; padding: 16px 18px; display: none; }
  .feedback.show { display: block; }
  .feedback b { display: block; margin-bottom: 4px; }
  .feedback.ok b { color: var(--ok); }
  .feedback.bad b { color: var(--bad); }
  .feedback p { margin: 0; font-size: 15px; color: var(--muted); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 0 22px; border-radius: 12px; border: 0; cursor: pointer;
    font-weight: 600; font-size: 16px; transition: background .2s, opacity .2s;
  }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.ghost { background: var(--card); box-shadow: var(--shadow); }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 200px; }

  /* ===== Результат ===== */
  .result { padding: 32px 22px; text-align: center; margin-top: 24px; }
  .big-ring { width: 140px; height: 140px; margin: 0 auto 16px; position: relative; }
  .big-ring svg { transform: rotate(-90deg); }
  .big-ring circle { fill: none; stroke-width: 10; }
  .big-ring .track { stroke: var(--line); }
  .big-ring .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .big-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 700; }
  .result h2 { margin: 0 0 4px; font-size: 22px; }
  .result p { margin: 0; color: var(--muted); }
  .mistakes { margin-top: 20px; text-align: left; }
  .mistakes h3 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 8px; padding: 0 4px; }
  .mistakes .item { padding: 14px 18px; margin-bottom: 8px; }
  .mistakes .item b { display: block; margin-bottom: 4px; }
  .mistakes .item p { margin: 0; font-size: 15px; color: var(--muted); }

  /* ===== Справочник ===== */
  .search {
    width: 100%; padding: 13px 16px; font: inherit; font-size: 16px;
    border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text);
    outline: none; transition: border-color .2s;
  }
  .search:focus { border-color: var(--accent); }
  .group-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 24px 4px 8px; font-weight: 600; }
  .list { overflow: hidden; }
  details { border-bottom: 1px solid var(--line); }
  details:last-child { border-bottom: 0; }
  summary {
    list-style: none; cursor: pointer; padding: 14px 18px; display: flex; gap: 12px;
    align-items: baseline; font-weight: 500; min-height: 48px;
  }
  summary::-webkit-details-marker { display: none; }
  summary .n { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; min-width: 22px; }
  summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details .def { padding: 0 18px 16px 52px; color: var(--muted); font-size: 16px; margin: 0; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .source { font-size: 13px; color: var(--muted); margin-top: 32px; text-align: center; }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .term h2 { font-size: 22px; }
    .brand { display: none; }
    .bar { justify-content: center; }
    .opt { padding: 14px; font-size: 15px; }
    details .def { padding-left: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="brand">Управление эксплуатационной работой</span>
    <nav class="seg" role="tablist">
      <button role="tab" data-tab="train" aria-selected="true">Тренировка</button>
      <button role="tab" data-tab="ref" aria-selected="false">Справочник</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- Вкладка «Тренировка»: три экрана -->
  <section id="tab-train">
    <div id="screen-tickets"></div>
    <div id="screen-quiz" hidden></div>
    <div id="screen-result" hidden></div>
  </section>

  <!-- Вкладка «Справочник» -->
  <section id="tab-ref" hidden>
    <h1>Справочник</h1>
    <p class="sub">Все термины с определениями по ПТЭ</p>
    <input id="search" class="search" type="search" placeholder="Поиск по термину или определению" autocomplete="off">
    <div id="ref-list"></div>
  </section>
</main>

<script>
/* ==========================================================================
   ДАННЫЕ ТЕРМИНОВ

   (приказ Минтранса России от 23.06.2022 № 250), раздел 1 «Термины
   и определения»; ссылки на ГОСТ и примечания опущены. Термины, которых
   там нет, — из ГОСТ 34530-2019 (помечены комментарием).
   distractors — три неверных варианта ответа.
   Чтобы изменить список — правьте массив; билеты пересчитаются сами.

      "Система интервального регулирования движения поездов, при которой на перегоне может находиться только один поезд, а разрешением на занятие перегона служит показание выходного светофора.",
      "Система интервального регулирования, при которой поезда следуют по сигналам проходных светофоров, а локомотивные светофоры дублируют их показания только при плохой видимости."

    distractors: [

      "Часть железнодорожного перегона, оборудованного полуавтоматической блокировкой, которая ограничена выходным светофором станции и светофором железнодорожного блок-поста."

/* ==========================================================================
   НАСТРОЙКИ
   ========================================================================== */
const TICKET_SIZE = 8;       // максимум терминов в билете
const READ_SECONDS = 60;     // время чтения, до которого ответ заблокирован
const STORE_KEY = "uer-terms-progress-v2";

/* Деление на билеты: не больше TICKET_SIZE терминов, размеры билетов
   выравниваются (43 термина → 8, 7, 7, 7, 7, 7), чтобы последний
   не оказался из 1–2 вопросов */
const TICKETS = [];
{
  const count = Math.ceil(TERMS.length / TICKET_SIZE);
  let from = 0;
  for (let i = 0; i < count; i++) {
    const size = Math.ceil((TERMS.length - from) / (count - i));
    TICKETS.push(TERMS.slice(from, from + size));
    from += size;
  }
}

/* ==========================================================================
   УТИЛИТЫ
   ========================================================================== */
// Перемешивание Фишера–Йетса (возвращает новый массив)
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
const $ = sel => document.querySelector(sel);

/* ==========================================================================
   ПРОГРЕСС (localStorage)
   Формат: { tickets: { [index]: { best: число, learned: [id, ...] } }, shuffle: bool }
   ========================================================================== */
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* хранилище недоступно — работаем без него */ }
  return { tickets: {}, shuffle: false };
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
let store = loadStore();
function ticketStat(i) {
  return store.tickets[i] || { best: null, learned: [] };
}

/* ==========================================================================
   ТАЙМЕР
   Отсчёт ведётся от отметки времени окончания (Date.now), поэтому он не
   «отстаёт», если вкладка была свёрнута. Интервал всегда очищается через
   stopTimer() при любом переходе между экранами.
   ========================================================================== */
let timerId = null;
function stopTimer() {
  if (timerId !== null) { clearInterval(timerId); timerId = null; }
}
function startTimer(onTick, onDone) {
  stopTimer();
  const endAt = Date.now() + READ_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    onTick(left);
    if (left <= 0) { stopTimer(); onDone(); }
  };
  tick();
  timerId = setInterval(tick, 250);
}

/* ==========================================================================
   СОСТОЯНИЕ ПРОХОЖДЕНИЯ
   ========================================================================== */
let quiz = null; // { ticket, items, pos, correct, correctIds, mistakes, answered, unlocked }

function inQuiz() {
  return quiz !== null && !$("#screen-quiz").hidden;
}

/* ===== Экран выбора билета ===== */
function renderTickets() {
  stopTimer();
  quiz = null;
  showScreen("tickets");
  const cards = TICKETS.map((t, i) => {
    const st = ticketStat(i);
    const learned = st.learned.filter(id => t.some(x => x.id === id)).length;
    const pct = Math.round(learned / t.length * 100);
    const best = st.best === null ? "Ещё не пройден" : `Лучший результат: ${st.best}/${t.length}`;
    return `
      <button class="ticket card" data-ticket="${i}">
        <b>Билет ${i + 1}</b>
        <small>${learned}/${t.length} изучено</small>
        <div class="meter"><i style="width:${pct}%"></i></div>
        <div class="best">${best}</div>
      </button>`;
  }).join("");

  $("#screen-tickets").innerHTML = `
    <h1>Тренировка</h1>
    <p class="sub">${TERMS.length} терминов · ${TICKETS.length} билетов · на чтение каждого вопроса ${READ_SECONDS} сек</p>
    <div class="tickets">${cards}</div>
    <div class="opts-row card">
      <label class="switch">
        <input type="checkbox" id="shuffle" ${store.shuffle ? "checked" : ""}>
        Перемешать термины внутри билета
      </label>
      <button class="link" id="reset">Сбросить прогресс</button>
    </div>`;

  $("#screen-tickets").querySelectorAll("[data-ticket]").forEach(b =>
    b.addEventListener("click", () => startQuiz(+b.dataset.ticket)));
  $("#shuffle").addEventListener("change", e => { store.shuffle = e.target.checked; saveStore(); });
  $("#reset").addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс по билетам?")) {
      store = { tickets: {}, shuffle: store.shuffle };
      saveStore();
      renderTickets();
    }
  });
}

/* ===== Запуск билета ===== */
function startQuiz(ticketIndex) {
  const terms = store.shuffle ? shuffle(TICKETS[ticketIndex]) : TICKETS[ticketIndex].slice();
  quiz = {
    ticket: ticketIndex,
    items: terms.map(t => ({
      term: t,
      // 1 правильный + 3 дистрактора, перемешанные
      options: shuffle([{ text: t.definition, ok: true }, ...t.distractors.map(d => ({ text: d, ok: false }))])
    })),
    pos: 0,
    correct: 0,
    correctIds: [],
    mistakes: []
  };
  renderQuestion();
}

        </button>`).join("")}
    </div>

    <div class="feedback card" id="feedback"></div>
    <div class="actions" id="next-wrap" hidden>
      <button class="btn primary" id="next">${quiz.pos + 1 < total ? "Далее" : "Показать результат"}</button>
    </div>`;

  $("#quit").addEventListener("click", () => {
    if (confirm("Выйти из билета? Текущий прогресс прохождения не сохранится.")) renderTickets();
  });
  $("#options").querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => answer(+b.dataset.i)));
  $("#next").addEventListener("click", next);

  // Блокировка ответа на 60 секунд
  startTimer(left => {
    $("#sec").textContent = left;
    $("#arc").style.strokeDashoffset = RING_LEN * (1 - left / READ_SECONDS);
    if (left > 0) $("#timer-text").textContent = `Читайте внимательно, выбор станет доступен через ${left} сек`;
  }, unlockOptions);

  window.scrollTo({ top: 0 });
}

function unlockOptions() {
  quiz.unlocked = true;
  $("#timer").classList.add("ready");
  $("#sec").textContent = "✓";
  $("#timer-text").textContent = "Выберите ответ";
  $("#options").querySelectorAll(".opt").forEach(b => {
    b.disabled = false;
    b.removeAttribute("aria-disabled");
    b.classList.remove("locked");
  });
}

function answer(i) {
  if (!quiz.unlocked || quiz.answered) return; // защита от ответа раньше минуты
  quiz.answered = true;
  const item = quiz.items[quiz.pos];
  const chosen = item.options[i];
  const right = item.options.find(o => o.ok);

  $("#options").querySelectorAll(".opt").forEach((b, idx) => {
    b.disabled = true;
    const o = item.options[idx];
    if (o.ok) b.classList.add("correct");
    else if (idx === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const fb = $("#feedback");
  if (chosen.ok) {
    quiz.correct++;
    quiz.correctIds.push(item.term.id);
    fb.className = "feedback card show ok";
    fb.innerHTML = `<b>Верно</b><p>${esc(item.term.term)} — ${esc(right.text)}</p>`;
  } else {
    quiz.mistakes.push(item.term);
    fb.className = "feedback card show bad";
    fb.innerHTML = `<b>Неверно</b><p>Правильный ответ: ${esc(right.text)}</p>`;
  }
  $("#next-wrap").hidden = false;
  $("#next").focus({ preventScroll: true });
}

function next() {
  if (!quiz.answered) return;
  quiz.pos++;
  if (quiz.pos < quiz.items.length) renderQuestion();
  else renderResult();
}

/* ===== Экран результатов ===== */
function renderResult() {
  stopTimer();
  showScreen("result");
  const total = quiz.items.length;
  const pct = Math.round(quiz.correct / total * 100);

  // Сохраняем лучший результат и изученные термины
  const st = ticketStat(quiz.ticket);
  st.best = Math.max(st.best ?? 0, quiz.correct);
  st.learned = Array.from(new Set([...st.learned, ...quiz.correctIds]));
  store.tickets[quiz.ticket] = st;
  saveStore();

  const R = 62, len = 2 * Math.PI * R;
  const verdict = pct === 100 ? "Отлично, без ошибок" : pct >= 80 ? "Хороший результат" : pct >= 50 ? "Неплохо, но стоит повторить" : "Нужно повторить билет";

  const ticketIndex = quiz.ticket;
  $("#screen-result").innerHTML = `
    <div class="result card">
      <div class="big-ring">
        <svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true">
          <circle class="track" cx="70" cy="70" r="${R}"/>
          <circle class="arc" id="big-arc" cx="70" cy="70" r="${R}" stroke-dasharray="${len}" stroke-dashoffset="${len}"/>
        </svg>
        <span>${pct}%</span>
      </div>
      <h2>Правильно: ${quiz.correct} из ${total}</h2>
      <p>${verdict} · лучший результат ${st.best}/${total}</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="again">Пройти ещё раз</button>
      <button class="btn ghost" id="to-tickets">Вернуться к билетам</button>
    </div>
    ${quiz.mistakes.length ? `
      <div class="mistakes">
        <h3>Ошибки — повторите эти термины</h3>
        ${quiz.mistakes.map(t => `<div class="item card"><b>${esc(t.term)}</b><p>${esc(t.definition)}</p></div>`).join("")}
      </div>` : ""}`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const arc = $("#big-arc");
    if (arc) arc.style.strokeDashoffset = len * (1 - pct / 100);
  }));

  $("#again").addEventListener("click", () => startQuiz(ticketIndex));
  $("#to-tickets").addEventListener("click", renderTickets);
  quiz = null;
  window.scrollTo({ top: 0 });
}

function showScreen(name) {
  ["tickets", "quiz", "result"].forEach(s => { $("#screen-" + s).hidden = s !== name; });
}

/* ==========================================================================
   СПРАВОЧНИК
   ========================================================================== */
function highlight(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const re = new RegExp("(" + esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return safe.replace(re, "<mark>$1</mark>");
}

function renderRef() {
  const q = $("#search").value.trim();
  const ql = q.toLowerCase();
  let html = "";
  let found = 0;
  TICKETS.forEach((t, ti) => {
    const rows = t.filter(x => !ql || x.term.toLowerCase().includes(ql) || x.definition.toLowerCase().includes(ql));
    if (!rows.length) return;
    found += rows.length;
    html += `<div class="group-title">Билет ${ti + 1}</div><div class="list card">` +
      rows.map(x => `
        <details ${ql ? "open" : ""}>
          <summary><span class="n">${x.id}</span><span>${highlight(x.term, q)}</span></summary>
          <p class="def">${highlight(x.definition, q)}</p>
        </details>`).join("") + `</div>`;
  });
  if (!found) html = `<div class="empty">Ничего не найдено по запросу «${esc(q)}»</div>`;
  html += `<p class="source">Определения: Комментарии к Правилам технической эксплуатации железных дорог РФ (приказ Минтранса России от 23.06.2022 № 250); отдельные термины — ГОСТ 34530-2019</p>`;
  $("#ref-list").innerHTML = html;
}
$("#search").addEventListener("input", renderRef);

/* ==========================================================================
   ВКЛАДКИ
   ========================================================================== */
document.querySelectorAll("[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    const tab = btn.dataset.tab;
    if (tab === "ref" && inQuiz() &&
        !confirm("Перейти в справочник? Прохождение билета будет прервано.")) return;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b === btn));
    if (tab === "ref") { renderTickets(); renderRef(); } // renderTickets() останавливает таймер
    $("#tab-train").hidden = tab !== "train";
    $("#tab-ref").hidden = tab !== "ref";
    window.scrollTo({ top: 0 });
  });
});

/* Клавиатура: 1–4 — выбор ответа, Enter — далее */
document.addEventListener("keydown", e => {
  if (!inQuiz() || e.target.tagName === "INPUT") return;
  if (/^[1-4]$/.test(e.key)) answer(+e.key - 1);
  else if (e.key === "Enter" && quiz.answered && document.activeElement?.id !== "next") next();
});

/* Предупреждение при уходе со страницы во время билета */
window.addEventListener("beforeunload", e => {
  if (inQuiz()) { e.preventDefault(); e.returnValue = ""; }
});

renderTickets();
</script>
</body>
</html>
